<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登录 · OCS 控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238ea8ff'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%230a0b0c' font-family='sans-serif'%3EO%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="/auth.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="brand">
    <div class="mark">O</div>
    <div>
      <h1>OCS 控制台</h1>
      <small>登录后管理自己的挂课账号</small>
    </div>
  </div>

  <form class="card" id="form" autocomplete="on">
    <h2>登录</h2>
    <p class="sub">用管理员发给你的账号，或者用邀请码注册一个。</p>
    <div class="msg err" id="msg"></div>

    <div class="field">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required />
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
    </div>

    <button class="primary" id="btnLogin" type="submit" style="width:100%;height:38px">登录</button>

    <div class="foot">
      有邀请码？<a href="/register.html">注册新账号</a>
    </div>
  </form>

  <p class="hint" style="margin-top:14px;text-align:center;max-width:380px">
    第一次使用：管理员账号 <span class="mono">admin</span> 的初始密码在程序目录的
    <span class="mono">data/admin-password.txt</span> 里。
  </p>
</div>

<script>
const $ = (id) => document.getElementById(id);
function show(msg, ok) {
  const n = $('msg');
  n.textContent = msg;
  n.className = 'msg show ' + (ok ? 'ok' : 'err');
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('btnLogin');
  btn.disabled = true;
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('username').value.trim(), password: $('password').value })
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error || '登录失败');
    show('登录成功，正在进入控制台…', true);
    location.href = '/';
  } catch (err) {
    show(err.message);
    btn.disabled = false;
  }
});

fetch('/api/auth/me').then((r) => r.json()).then((j) => {
  if (j && j.account) location.href = '/';
}).catch(() => {});
</script>
</body>
</html>
